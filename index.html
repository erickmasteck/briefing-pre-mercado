<!doctype html> <html lang="pt-BR"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>MSTK Trading Lab · Briefing Pré-Abertura</title> <style> *{box-sizing:border-box;margin:0;padding:0} body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#070b14;color:#e5e9f5;min-height:100vh;position:relative;overflow-x:hidden} body::before,body::after{content:'';position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.35;pointer-events:none;z-index:0} body::before{background:#6366f1;top:-160px;left:-120px} body::after{background:#06b6d4;top:260px;right:-200px} .w{max-width:1100px;margin:0 auto;padding:24px 16px 48px;position:relative;z-index:1} .pos{--t:#34d399}.neg{--t:#f87171}.neu{--t:#94a3b8} .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px} .k{font-size:12px;letter-spacing:.2em;color:#a5b4fc;display:flex;align-items:center;gap:8px} .k i{font-style:normal;background:rgba(165,180,252,.15);border:1px solid rgba(165,180,252,.4);color:#c7d2fe;border-radius:6px;padding:2px 6px;font-size:10px;letter-spacing:.05em;font-weight:700} .hd .u{text-align:right;font-size:12px;color:#8b95b1;line-height:1.5} h1{font-size:28px;margin-top:4px;background:linear-gradient(90deg,#fff,#a5b4fc 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent} .sum{margin:16px 0 22px;padding:18px;border-radius:18px;line-height:1.65;font-size:14px;color:#b6bdd3;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)} .sum b{display:block;color:var(--t);text-shadow:0 0 22px var(--t);font-size:16px;margin-bottom:6px} .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t);box-shadow:0 0 10px var(--t);margin-right:8px} .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px} .c{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)} .c.full{grid-column:1/-1} h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#818cf8;margin-bottom:8px} .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.06)} .r .v{font-weight:700;text-align:right;padding:2px 9px;border-radius:8px;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t)} .ov{overflow-x:auto} .ag{width:100%;border-collapse:collapse;font-size:12px} .ag td,.ag th{padding:7px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)} .ag th{font-size:10px;text-transform:uppercase;opacity:.65} .st{color:#f5b301;white-space:nowrap} .nw{font-size:13px;line-height:1.55;padding-left:18px;color:#c3c9de} .nw li{margin-bottom:4px} .err{padding:24px;text-align:center;color:#f87171} </style> </head> <body> <div class="w" id="app"><div class="err" style="color:#94a3b8">Carregando briefing...</div></div> <script> function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});} function tone(t){return t==='positive'?'pos':(t==='negative'?'neg':'neu');} function rows(s){return (s.items||[]).map(function(i){return '<div class="r '+tone(i.tone)+'"><span>'+esc(i.label)+'</span><span class="v">'+esc(i.value)+'</span></div>';}).join('');} function agenda(a){ if(!a||!a.length)return '<div style="font-size:13px;color:#8b95b1">Sem eventos de 2 ou 3 estrelas hoje.</div>'; return '<div class="ov"><table class="ag"><tr><th>Hora</th><th>País</th><th>Evento</th><th>Imp.</th><th>Atual</th><th>Prev.</th><th>Ant.</th></tr>'+a.map(function(e){return '<tr><td>'+esc(e.time)+'</td><td>'+esc(e.country)+'</td><td>'+esc(e.event)+'</td><td class="st">'+'★'.repeat(e.stars||0)+'</td><td>'+esc(e.actual)+'</td><td>'+esc(e.forecast)+'</td><td>'+esc(e.previous)+'</td></tr>';}).join('')+'</table></div>'; } function render(D){ var h='<div class="hd"><div><div class="k"><i>MK</i>MSTK TRADING LAB</div><h1>Briefing Pré-Mercado</h1></div><div class="u">Abertura WIN 09:00<br>'+esc(D.updated_at)+'</div></div>'; h+='<div class="sum '+tone(D.gap_tone)+'"><b><i class="dot"></i>'+esc(D.gap_estimate)+'</b>'+esc(D.summary)+'</div>'; h+='<div class="g">'+(D.sections||[]).map(function(s){return '<div class="c"><h3>'+esc(s.title)+'</h3>'+rows(s)+'</div>';}).join(''); h+='<div class="c full"><h3>Agenda econômica</h3>'+agenda(D.agenda)+'</div>'; h+='<div class="c full"><h3>Notícias overnight</h3><ul class="nw">'+(D.news||[]).map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul></div></div>'; document.getElementById('app').innerHTML=h; } fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(e){document.getElementById('app').innerHTML='<div class="err">Não foi possível carregar o briefing.</div>';}); </script> </body> </html>
